// Local API between sentientd (server, owns the store) and its clients
// (sen, sen serve), served over a Unix domain socket. Narrow by design:
// only the reads the views need. Regenerate the Go code with `make proto`.
syntax = "proto3";

package sentient.v1;

import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/nosaka4i/sentient/internal/api/sentientpb";

service Sentient {
  // Status returns the data behind `sen status` and the web dashboard.
  rpc Status(StatusRequest) returns (StatusResponse);
  // Health returns sentient's own state (web /health, later `sen health`).
  rpc Health(HealthRequest) returns (HealthResponse);
  // PromptDetail returns everything about one prompt (web /prompt/<id>).
  rpc PromptDetail(PromptDetailRequest) returns (PromptDetailResponse);
}

message PromptDetailRequest {
  int64 id = 1;
}

message DiffLine {
  // "h" hunk/note, "a" added, "d" removed, "c" context.
  string kind = 1;
  string text = 2;
}

message FileChange {
  string path = 1;
  int64 added = 2;
  int64 removed = 3;
  bool outside_repo = 4;
  repeated int64 steps = 5; // step numbers of the edits
  string by = 6;            // tool that made the change (Edit, Write…)
  string action = 7;        // create | update | delete
  google.protobuf.Timestamp first = 8;
  repeated DiffLine diff = 9;
}

message Step {
  int64 n = 1;
  google.protobuf.Duration offset = 2; // since the prompt started
  string resource = 3;
  string action = 4;
  string path = 5;
  bool failed = 6;
  string evidence = 7; // kernel | log | both
  // A Bash tool call that ran several commands: the same call_id on each
  // of its steps, with the whole command line on the first.
  string call_id = 8;
  string call_command = 9;
  bool builtin = 10; // a shell builtin (never execs): evidence is log only
}

message PromptDetailResponse {
  google.protobuf.Timestamp history_begins = 1;
  Prompt prompt = 2;
  repeated ActivityRow activity = 3;
  repeated FileChange files = 4;
  repeated Step steps = 5;
  string reply = 6; // the agent's final message for the prompt
  google.protobuf.Timestamp reply_at = 7;
  string repo_root = 8; // empty if the session has no repo
}

message HealthRequest {}

message NamedCount {
  string name = 1;
  int64 count = 2;
}

message HealthResponse {
  google.protobuf.Timestamp checked_at = 1;
  google.protobuf.Timestamp history_begins = 2; // unset if no data

  message Daemon {
    string version = 1;
    google.protobuf.Timestamp started = 2;
    double cpu_percent = 3;
    google.protobuf.Duration cpu_window = 4;
    int64 rss_bytes = 5;
    string socket = 6;
    string user = 7;
    bool root = 8;
  }
  Daemon daemon = 3;

  message API {
    google.protobuf.Timestamp since = 1;
    int64 requests = 2;
    double per_sec_now = 3;
    google.protobuf.Duration p50 = 4;
    google.protobuf.Duration p95 = 5;
    google.protobuf.Duration p99 = 6;
    int64 latency_count = 7;
    int64 errors = 8;
    repeated NamedCount errors_by_code = 9;
    repeated NamedCount methods = 10;
    repeated string clients = 11;
  }
  API api = 4;

  message Storage {
    string data_dir = 1;
    string db_path = 2;
    int64 db_bytes = 3;
    int64 free_bytes = 4;
    int64 size_bytes = 5;
  }
  Storage storage = 5;

  message IngestAgent {
    string agent = 1;
    google.protobuf.Timestamp last_record = 2; // unset if none
    int64 files = 3;
    int64 unknown = 4;
  }
  repeated IngestAgent ingest = 6;

  message Integrity {
    google.protobuf.Timestamp checked_at = 1; // unset = not checked yet
    google.protobuf.Timestamp full_at = 2;
    int64 records = 3;
    bool ok = 4;
    int64 bad_record_id = 5;
    google.protobuf.Duration interval = 6;
    bool gap_tracking = 7;
  }
  Integrity integrity = 7;

  message Agent {
    string agent = 1;
    string version = 2;
    string logs = 3;
  }
  repeated Agent agents = 8;

  message LiveSession {
    string session_id = 1;
    string agent = 2;
    string repo = 3;
    google.protobuf.Timestamp last_activity = 4;
  }
  repeated LiveSession live = 9;

  message Sudo {
    bool checked = 1;
    string reason = 2;
    repeated string passwordless = 3;
  }
  Sudo sudo = 10;
}

message StatusRequest {
  // The activity window [from, to), computed by the client (the last 24
  // hours).
  google.protobuf.Timestamp from = 1;
  google.protobuf.Timestamp to = 2;
  // How many of the newest prompts to return (0 = server default, 5).
  int32 prompt_limit = 3;
}

message ActivityRow {
  string resource = 1;
  string action = 2;
  int64 count = 3;
  // One-line summary as the CLI prints it.
  string summary = 4;
  // Structured summary parts (see query.ActivityRow).
  int64 repos = 5;
  int64 outside = 6;
  int64 added = 7;
  int64 removed = 8;
  int64 failed = 9;
  string hosts = 10;
}

message Prompt {
  int64 id = 1;
  string text = 2;
  google.protobuf.Timestamp started = 3;
  google.protobuf.Duration duration = 4;
  bool running = 5;
  string agent = 6;
  string repo = 7;
  string session_id = 8;
  int64 actions = 9;
  int64 flags = 10;
}

message StatusResponse {
  // Earliest ingested record; unset when nothing has been ingested yet.
  google.protobuf.Timestamp history_begins = 1;
  // The summary rows for the window, in display order.
  repeated ActivityRow activity = 2;
  // Stored log records of unknown type or unparsable lines.
  int64 unknown_records = 3;
  // sentientd's version.
  string daemon_version = 4;
  // Every prompt started in the window, and the newest prompt_limit.
  int64 prompts_total = 5;
  repeated Prompt prompts = 6;
}
