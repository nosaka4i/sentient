// Local API between sentientd (server, owns the store) and its clients
// (sen, sen serve), served over a Unix domain socket. Narrow by design:
// only the reads the views need. Regenerate the Go code with `make proto`.
syntax = "proto3";

package sentient.v1;

import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/nosaka4i/sentient/internal/api/sentientpb";

service Sentient {
  // Status returns the data behind `sen status` and the web dashboard.
  rpc Status(StatusRequest) returns (StatusResponse);
  // Health returns sentient's own state (web /health, later `sen health`).
  rpc Health(HealthRequest) returns (HealthResponse);
  // PromptDetail returns everything about one prompt (web /prompt/<id>).
  rpc PromptDetail(PromptDetailRequest) returns (PromptDetailResponse);
  // PromptWindow returns the prompts of a time window, or of one session,
  // with their sessions (web /prompts, filtered in the browser).
  rpc PromptWindow(PromptWindowRequest) returns (PromptWindowResponse);
  // SessionDetail returns one session and its prompts (web /session/<id>).
  rpc SessionDetail(SessionDetailRequest) returns (SessionDetailResponse);
  // SessionList returns the sessions active in a time window (web /sessions).
  rpc SessionList(SessionListRequest) returns (SessionListResponse);
  // ActivityList returns the counts of every resource/action kind in a window
  // and the events of one kind (web /activity).
  rpc ActivityList(ActivityListRequest) returns (ActivityListResponse);
}

message ActivityListRequest {
  int32 days = 1;       // the window is the last N days (>= 1)
  string resource = 2;  // the kind whose events to list; empty = a default
  string action = 3;
  bool failed_only = 4;
  int32 limit = 5;      // 0 = 200
  string query = 6;     // only events whose text contains this (case-insensitive)
}

message ActivityEvent {
  google.protobuf.Timestamp at = 1;
  string what = 2;       // the path, command, host or text
  bool failed = 3;
  int64 lines_added = 4;
  int64 lines_removed = 5;
  int64 prompt_id = 6;
  string prompt_text = 7;
  string agent = 8;
  string repo = 9;
  string session_id = 10;
}

message ActivityListResponse {
  google.protobuf.Timestamp history_begins = 1;
  google.protobuf.Timestamp from = 2;
  google.protobuf.Timestamp to = 3;
  repeated ActivityRow rows = 4;   // one per kind, zeros included
  string resource = 5;             // the kind whose events follow
  string action = 6;
  repeated ActivityEvent events = 7; // newest first
  int64 events_total = 8;
}

message SessionListRequest {
  int32 days = 1; // sessions active in the last N days; 0 = all time
}

message SessionListRow {
  SessionSummary summary = 1;
  string first_prompt = 2;
  bool running = 3;
}

message SessionListResponse {
  google.protobuf.Timestamp history_begins = 1;
  repeated SessionListRow sessions = 2; // most recently active first
  int64 total = 3;                      // sessions with prompts, in any window
  repeated string agents = 4;
  repeated string repos = 5;
}

message SessionSummary {
  string session_id = 1;
  string agent = 2;
  string repo = 3;
  google.protobuf.Timestamp started = 4;
  google.protobuf.Timestamp last_activity = 5;
  int64 prompts = 6;
  int64 actions = 7; // actions on the system
  int64 flags = 8;
}

// SessionOption is one entry of the Session filter menu.
message SessionOption {
  string session_id = 1;
  string agent = 2;
  string repo = 3;
}

message PromptWindowRequest {
  int32 days = 1; // the last N days; 0 = all time
  google.protobuf.Timestamp before = 2; // only prompts that started before this (paging older)
  string session_id = 3; // one session's prompts instead of a time window
  int32 limit = 4;       // 0 = 5000 (the maximum)
  // A window with fewer prompts than this is widened to the newest this many,
  // so a quiet week doesn't look empty. 0 = 100.
  int32 min_prompts = 5;
}

message PromptWindowResponse {
  google.protobuf.Timestamp history_begins = 1;
  repeated Prompt prompts = 2;          // newest first
  repeated SessionSummary sessions = 3; // the sessions of those prompts
  int64 matching = 4;                   // prompts in the window or session, before the limit
  bool more = 5;                        // older ones exist beyond these
  google.protobuf.Timestamp oldest = 6; // when the oldest returned prompt started
  bool widened = 7;                     // the window was widened to reach min_prompts
  repeated string agents = 8;           // every agent seen, for the filters
  repeated string repos = 9;            // every repo seen
  repeated SessionOption menu = 10;     // recent sessions, for the Session menu
  int64 older_sessions = 11;            // sessions left out of the menu
}

message SessionDetailRequest {
  string session_id = 1; // the agent's session id
}

message Subagent {
  string kind = 1; // subagent type (Explore, general-purpose…)
  string task = 2;
  google.protobuf.Timestamp at = 3;
  int64 prompt_number = 4; // 1-based position of the prompt that started it, 0 if unknown
}

message SessionDetailResponse {
  google.protobuf.Timestamp history_begins = 1;
  string session_id = 2;
  string agent = 3;
  string agent_version = 4;
  string repo = 5;
  string cwd = 6;
  google.protobuf.Timestamp started = 7;
  google.protobuf.Timestamp last_activity = 8;
  bool running = 9;
  int64 actions = 10; // actions on the system, all prompts
  int64 flags = 11;
  repeated Prompt prompts = 12;      // the newest few, newest first
  int64 total_prompts = 15;          // every prompt in the session
  string first_prompt = 16;          // the text the session started with
  repeated ActivityRow activity = 13;
  repeated Subagent subagents = 14;
}

message PromptDetailRequest {
  int64 id = 1;
}

message DiffLine {
  // "h" hunk/note, "a" added, "d" removed, "c" context.
  string kind = 1;
  string text = 2;
}

message FileChange {
  string path = 1;
  int64 added = 2;
  int64 removed = 3;
  bool outside_repo = 4;
  repeated int64 steps = 5; // step numbers of the edits
  string by = 6;            // tool that made the change (Edit, Write…)
  string action = 7;        // create | update | delete
  google.protobuf.Timestamp first = 8;
  repeated DiffLine diff = 9;
}

message Step {
  int64 n = 1;
  google.protobuf.Duration offset = 2; // since the prompt started
  string resource = 3;
  string action = 4;
  string path = 5;
  bool failed = 6;
  string evidence = 7; // kernel | log | both
  // A Bash tool call that ran several commands: the same call_id on each
  // of its steps, with the whole command line on the first.
  string call_id = 8;
  string call_command = 9;
  bool builtin = 10; // a shell builtin (never execs): evidence is log only
}

message PromptDetailResponse {
  google.protobuf.Timestamp history_begins = 1;
  Prompt prompt = 2;
  repeated ActivityRow activity = 3;
  repeated FileChange files = 4;
  repeated Step steps = 5;
  string reply = 6; // the agent's final message for the prompt
  google.protobuf.Timestamp reply_at = 7;
  string repo_root = 8; // empty if the session has no repo
}

message HealthRequest {}

message NamedCount {
  string name = 1;
  int64 count = 2;
}

message HealthResponse {
  google.protobuf.Timestamp checked_at = 1;
  google.protobuf.Timestamp history_begins = 2; // unset if no data

  message Daemon {
    string version = 1;
    google.protobuf.Timestamp started = 2;
    double cpu_percent = 3;
    google.protobuf.Duration cpu_window = 4;
    int64 rss_bytes = 5;
    string socket = 6;
    string user = 7;
    bool root = 8;
  }
  Daemon daemon = 3;

  message API {
    google.protobuf.Timestamp since = 1;
    int64 requests = 2;
    double per_sec_now = 3;
    google.protobuf.Duration p50 = 4;
    google.protobuf.Duration p95 = 5;
    google.protobuf.Duration p99 = 6;
    int64 latency_count = 7;
    int64 errors = 8;
    repeated NamedCount errors_by_code = 9;
    repeated NamedCount methods = 10;
    repeated string clients = 11;
  }
  API api = 4;

  message Storage {
    string data_dir = 1;
    string db_path = 2;
    int64 db_bytes = 3;
    int64 free_bytes = 4;
    int64 size_bytes = 5;
  }
  Storage storage = 5;

  message IngestAgent {
    string agent = 1;
    google.protobuf.Timestamp last_record = 2; // unset if none
    int64 files = 3;
    int64 unknown = 4;
  }
  repeated IngestAgent ingest = 6;

  message Integrity {
    google.protobuf.Timestamp checked_at = 1; // unset = not checked yet
    google.protobuf.Timestamp full_at = 2;
    int64 records = 3;
    bool ok = 4;
    int64 bad_record_id = 5;
    google.protobuf.Duration interval = 6;
    bool gap_tracking = 7;
  }
  Integrity integrity = 7;

  message Agent {
    string agent = 1;
    string version = 2;
    string logs = 3;
  }
  repeated Agent agents = 8;

  message LiveSession {
    string session_id = 1;
    string agent = 2;
    string repo = 3;
    google.protobuf.Timestamp last_activity = 4;
  }
  repeated LiveSession live = 9;

  message Sudo {
    bool checked = 1;
    string reason = 2;
    repeated string passwordless = 3;
  }
  Sudo sudo = 10;
}

message StatusRequest {
  // The activity window [from, to), computed by the client (the last 24
  // hours).
  google.protobuf.Timestamp from = 1;
  google.protobuf.Timestamp to = 2;
  // How many of the newest prompts to return (0 = server default, 5).
  int32 prompt_limit = 3;
}

message ActivityRow {
  string resource = 1;
  string action = 2;
  int64 count = 3;
  // One-line summary as the CLI prints it.
  string summary = 4;
  // Structured summary parts (see query.ActivityRow).
  int64 repos = 5;
  int64 outside = 6;
  int64 added = 7;
  int64 removed = 8;
  int64 failed = 9;
  string hosts = 10;
}

message Prompt {
  int64 id = 1;
  string text = 2;
  google.protobuf.Timestamp started = 3;
  google.protobuf.Duration duration = 4;
  bool running = 5;
  string agent = 6;
  string repo = 7;
  string session_id = 8;
  int64 actions = 9;
  int64 flags = 10;
}

message StatusResponse {
  // Earliest ingested record; unset when nothing has been ingested yet.
  google.protobuf.Timestamp history_begins = 1;
  // The summary rows for the window, in display order.
  repeated ActivityRow activity = 2;
  // Stored log records of unknown type or unparsable lines.
  int64 unknown_records = 3;
  // sentientd's version.
  string daemon_version = 4;
  // Every prompt started in the window, and the newest prompt_limit.
  int64 prompts_total = 5;
  repeated Prompt prompts = 6;
}
