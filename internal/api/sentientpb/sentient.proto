// Local API between sentientd (server, owns the store) and its clients
// (sen, sen serve), served over a Unix domain socket. Narrow by design:
// only the reads the views need. Regenerate the Go code with `make proto`.
syntax = "proto3";

package sentient.v1;

import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/nosaka4i/sentient/internal/api/sentientpb";

service Sentient {
  // Status returns the data behind `sen status` and the web dashboard.
  rpc Status(StatusRequest) returns (StatusResponse);
  // Health returns sentient's own state (web /health, later `sen health`).
  rpc Health(HealthRequest) returns (HealthResponse);
  // PromptDetail returns everything about one prompt (web /prompt/<id>).
  rpc PromptDetail(PromptDetailRequest) returns (PromptDetailResponse);
  // ListPrompts returns prompts newest first, filtered (web /prompts).
  rpc ListPrompts(ListPromptsRequest) returns (ListPromptsResponse);
  // ListSessionGroups returns sessions with their newest matching prompts
  // (web /prompts, all sessions).
  rpc ListSessionGroups(ListSessionGroupsRequest) returns (ListSessionGroupsResponse);
  // SessionDetail returns one session and its prompts (web /session/<id>).
  rpc SessionDetail(SessionDetailRequest) returns (SessionDetailResponse);
}

message ListPromptsRequest {
  string text = 1;   // substring of the prompt text, case-insensitive
  string agent = 2;  // exact agent name
  string repo = 3;   // repo (or cwd) basename
  bool flagged = 4;  // only prompts with open alerts
  int32 limit = 5;   // 0 = server default (50), max 1000
  string session_id = 6; // only this session's prompts (the agent's session id)
}

message SessionSummary {
  string session_id = 1;
  string agent = 2;
  string repo = 3;
  google.protobuf.Timestamp started = 4;
  google.protobuf.Timestamp last_activity = 5;
  int64 prompts = 6;
  int64 actions = 7; // actions on the system
  int64 flags = 8;
}

// SessionOption is one entry of the Session filter menu.
message SessionOption {
  string session_id = 1;
  string agent = 2;
  string repo = 3;
}

message ListPromptsResponse {
  google.protobuf.Timestamp history_begins = 1;
  int64 total = 2;              // prompts matching the filter
  repeated Prompt prompts = 3;  // the newest `limit` of them
  repeated string agents = 4;   // every agent seen, for the filter
  repeated string repos = 5;    // every repo seen, for the filter
  SessionSummary session = 6;   // set when the request named a session
  repeated SessionOption sessions = 7; // recent sessions, for the Session menu
  int64 older_sessions = 8;     // sessions not in `sessions`
}

message ListSessionGroupsRequest {
  string text = 1;
  string agent = 2;
  string repo = 3;
  bool flagged = 4;
  int32 session_limit = 5; // 0 = server default (10), max 200
  int32 per_session = 6;   // prompts per session, 0 = 3
}

message SessionGroup {
  SessionSummary session = 1; // `prompts` is the session's total
  int64 matching = 2;         // its prompts matching the filter
  repeated Prompt prompts = 3; // the newest few of those
}

message ListSessionGroupsResponse {
  google.protobuf.Timestamp history_begins = 1;
  int64 total_prompts = 2;   // prompts matching the filter, all sessions
  int64 total_sessions = 3;  // sessions with a matching prompt
  repeated SessionGroup groups = 4; // newest session first
  repeated string agents = 5;
  repeated string repos = 6;
  repeated SessionOption sessions = 7;
  int64 older_sessions = 8;
}

message SessionDetailRequest {
  string session_id = 1; // the agent's session id
}

message Subagent {
  string kind = 1; // subagent type (Explore, general-purpose…)
  string task = 2;
  google.protobuf.Timestamp at = 3;
  int64 prompt_number = 4; // 1-based position of the prompt that started it, 0 if unknown
}

message SessionDetailResponse {
  google.protobuf.Timestamp history_begins = 1;
  string session_id = 2;
  string agent = 3;
  string agent_version = 4;
  string repo = 5;
  string cwd = 6;
  google.protobuf.Timestamp started = 7;
  google.protobuf.Timestamp last_activity = 8;
  bool running = 9;
  int64 actions = 10; // actions on the system, all prompts
  int64 flags = 11;
  repeated Prompt prompts = 12;      // oldest first
  repeated ActivityRow activity = 13;
  repeated Subagent subagents = 14;
}

message PromptDetailRequest {
  int64 id = 1;
}

message DiffLine {
  // "h" hunk/note, "a" added, "d" removed, "c" context.
  string kind = 1;
  string text = 2;
}

message FileChange {
  string path = 1;
  int64 added = 2;
  int64 removed = 3;
  bool outside_repo = 4;
  repeated int64 steps = 5; // step numbers of the edits
  string by = 6;            // tool that made the change (Edit, Write…)
  string action = 7;        // create | update | delete
  google.protobuf.Timestamp first = 8;
  repeated DiffLine diff = 9;
}

message Step {
  int64 n = 1;
  google.protobuf.Duration offset = 2; // since the prompt started
  string resource = 3;
  string action = 4;
  string path = 5;
  bool failed = 6;
  string evidence = 7; // kernel | log | both
  // A Bash tool call that ran several commands: the same call_id on each
  // of its steps, with the whole command line on the first.
  string call_id = 8;
  string call_command = 9;
  bool builtin = 10; // a shell builtin (never execs): evidence is log only
}

message PromptDetailResponse {
  google.protobuf.Timestamp history_begins = 1;
  Prompt prompt = 2;
  repeated ActivityRow activity = 3;
  repeated FileChange files = 4;
  repeated Step steps = 5;
  string reply = 6; // the agent's final message for the prompt
  google.protobuf.Timestamp reply_at = 7;
  string repo_root = 8; // empty if the session has no repo
}

message HealthRequest {}

message NamedCount {
  string name = 1;
  int64 count = 2;
}

message HealthResponse {
  google.protobuf.Timestamp checked_at = 1;
  google.protobuf.Timestamp history_begins = 2; // unset if no data

  message Daemon {
    string version = 1;
    google.protobuf.Timestamp started = 2;
    double cpu_percent = 3;
    google.protobuf.Duration cpu_window = 4;
    int64 rss_bytes = 5;
    string socket = 6;
    string user = 7;
    bool root = 8;
  }
  Daemon daemon = 3;

  message API {
    google.protobuf.Timestamp since = 1;
    int64 requests = 2;
    double per_sec_now = 3;
    google.protobuf.Duration p50 = 4;
    google.protobuf.Duration p95 = 5;
    google.protobuf.Duration p99 = 6;
    int64 latency_count = 7;
    int64 errors = 8;
    repeated NamedCount errors_by_code = 9;
    repeated NamedCount methods = 10;
    repeated string clients = 11;
  }
  API api = 4;

  message Storage {
    string data_dir = 1;
    string db_path = 2;
    int64 db_bytes = 3;
    int64 free_bytes = 4;
    int64 size_bytes = 5;
  }
  Storage storage = 5;

  message IngestAgent {
    string agent = 1;
    google.protobuf.Timestamp last_record = 2; // unset if none
    int64 files = 3;
    int64 unknown = 4;
  }
  repeated IngestAgent ingest = 6;

  message Integrity {
    google.protobuf.Timestamp checked_at = 1; // unset = not checked yet
    google.protobuf.Timestamp full_at = 2;
    int64 records = 3;
    bool ok = 4;
    int64 bad_record_id = 5;
    google.protobuf.Duration interval = 6;
    bool gap_tracking = 7;
  }
  Integrity integrity = 7;

  message Agent {
    string agent = 1;
    string version = 2;
    string logs = 3;
  }
  repeated Agent agents = 8;

  message LiveSession {
    string session_id = 1;
    string agent = 2;
    string repo = 3;
    google.protobuf.Timestamp last_activity = 4;
  }
  repeated LiveSession live = 9;

  message Sudo {
    bool checked = 1;
    string reason = 2;
    repeated string passwordless = 3;
  }
  Sudo sudo = 10;
}

message StatusRequest {
  // The activity window [from, to), computed by the client (the last 24
  // hours).
  google.protobuf.Timestamp from = 1;
  google.protobuf.Timestamp to = 2;
  // How many of the newest prompts to return (0 = server default, 5).
  int32 prompt_limit = 3;
}

message ActivityRow {
  string resource = 1;
  string action = 2;
  int64 count = 3;
  // One-line summary as the CLI prints it.
  string summary = 4;
  // Structured summary parts (see query.ActivityRow).
  int64 repos = 5;
  int64 outside = 6;
  int64 added = 7;
  int64 removed = 8;
  int64 failed = 9;
  string hosts = 10;
}

message Prompt {
  int64 id = 1;
  string text = 2;
  google.protobuf.Timestamp started = 3;
  google.protobuf.Duration duration = 4;
  bool running = 5;
  string agent = 6;
  string repo = 7;
  string session_id = 8;
  int64 actions = 9;
  int64 flags = 10;
}

message StatusResponse {
  // Earliest ingested record; unset when nothing has been ingested yet.
  google.protobuf.Timestamp history_begins = 1;
  // The summary rows for the window, in display order.
  repeated ActivityRow activity = 2;
  // Stored log records of unknown type or unparsable lines.
  int64 unknown_records = 3;
  // sentientd's version.
  string daemon_version = 4;
  // Every prompt started in the window, and the newest prompt_limit.
  int64 prompts_total = 5;
  repeated Prompt prompts = 6;
}
